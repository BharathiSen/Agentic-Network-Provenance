[project]
name = "agentic-network-provenance"
version = "0.1.0"
description = "Prototype provenance and verification for AI-driven network-management actions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "alembic==1.14.1",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
    "pycose==1.1.0",
    "cbor2==5.6.5",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
    "black==24.10.0",
]

[tool.pytest.ini_options]
testpaths = ["services"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "build", "dist"]

[tool.black]
line-length = 88
target-version = ["py312"]