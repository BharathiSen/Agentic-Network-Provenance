[project]
name = "provenance"
version = "0.1.0"
description = "Shared information model, config binding, COSE signing, and freshness logic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pycose==1.1.0",
    "cbor2==5.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]
